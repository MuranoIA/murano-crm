name: ETL RD Conversas -> Supabase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do ETL"
        type: choice
        default: incremental
        options: [incremental, full, mensagens]
  schedule:
    # A cada 20 min em horário comercial (dias úteis) — sempre modo incremental (rápido).
    # Cron do GitHub roda em UTC. Brasília = UTC-3, então 11-23 UTC ≈ 08h-20h BRT.
    # 20 min mantém o uso dentro do plano grátis do GitHub Actions (~860 runs/mês).
    - cron: "*/20 11-23 * * 1-5"

# Evita empilhar cargas: se uma execução ainda roda quando outra começa, a nova espera.
concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # incremental termina em poucos minutos; full (manual) pode levar mais.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar ETL
        # schedule dispara sem inputs -> mode vazio -> default "incremental" no run.ts
        env:
          ETL_MODE: ${{ github.event.inputs.mode }}
          RD_CONVERSAS_TOKEN: ${{ secrets.RD_CONVERSAS_TOKEN }}
          RD_CONVERSAS_BASE_URL: ${{ secrets.RD_CONVERSAS_BASE_URL }}
          RD_CONVERSAS_PRIVATE_JWK: ${{ secrets.RD_CONVERSAS_PRIVATE_JWK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run etl
