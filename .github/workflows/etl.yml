name: ETL RD Conversas -> Supabase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do ETL"
        type: choice
        default: incremental
        options: [incremental, full, mensagens]
  schedule:
    # INCREMENTAL a cada 10 min, 24/7 (inclui noite e fim de semana). Antes era só
    # seg-sex 08h-20h BRT (11-23 UTC, dias 1-5) — por isso os dados ficavam horas/dias
    # defasados fora do horário comercial e no fim de semana. Repo público => Actions
    # grátis/ilimitado, então 24/7 é viável. Cron do GitHub roda em UTC.
    - cron: "*/10 * * * *"
    # FULL uma vez por dia, de madrugada (06:05 UTC ≈ 03:05 BRT). O full re-checa TODO
    # atendimento aberto (janela 89d), cobrindo a "cauda longa": conversa parada há mais
    # dias que a janela do incremental e que recebeu msg nova (ex.: template manual no RD
    # numa conversa ociosa). Roda antes do horário comercial, sem atrapalhar os incrementais.
    - cron: "5 6 * * *"

# Evita empilhar cargas: se uma execução ainda roda quando outra começa, a nova espera.
concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # incremental termina em ~15 min; full (diário/manual) pode levar mais.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar ETL
        # Modo: manual usa o input; agendado usa full só no cron das 06:05, senão incremental.
        env:
          ETL_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '5 6 * * *' && 'full' || 'incremental') }}
          # janela da varredura barata (/exists), só conversas ATIVAS na janela. 3 dias
          # equilibra cobertura x tempo de execução (~1,2s/checagem). A cauda longa fica
          # com o full diário + os disparos recentes (abaixo).
          ETL_SCAN_DAYS: 3
          # ORÇAMENTO DE CHAMADAS por run. A API do RD sustenta ~48 req/min (medido).
          #
          # REVISADO EM 03/08/2026: os valores antigos (budget 200, conc 1, sleep 700 =>
          # ~30 req/min) throttlavam o ETL de propósito para "deixar 15-18 req/min livres
          # pro auto-sync da coluna Negociação feito pelo board". Esse auto-sync foi
          # REMOVIDO do navegador (ver web/app/page.tsx): ele consumia até 60 req/min POR
          # ABA ABERTA contra um teto total de 48, e era o real motivo dos 429 nos envios
          # de template. Com ele fora, a cota que o ETL cedia não tem mais para quem ir.
          #
          # Novos valores miram ~40 req/min, deixando ~8/min de folga para os envios de
          # template do board (ação do usuário, não pode falhar) e para o etl-fast.
          # SE VOLTAR A APARECER 429 NO ENVIO: baixe ETL_SCAN_CONC para 1 e suba
          # ETL_SCAN_SLEEP — nesta ordem, e confira nos logs do run qual fase saturou.
          ETL_CALL_BUDGET: 300
          ETL_CRON_MIN: 10
          # pausa entre checagens /exists (ms) e concorrência. Concorrência NÃO fura o teto
          # de 48/min (medido: conc=3 deu a mesma taxa que conc=1) — serve só para aproveitar
          # a latência. conc=12 gerou 429 em 90% das chamadas; não passe de 3.
          ETL_SCAN_SLEEP: 250
          ETL_SCAN_CONC: 2
          # re-sincroniza clientes que receberam template PELO BOARD nos últimos N dias
          # (tabela disparos_template), mesmo que estejam "parados" fora da varredura —
          # garante que o template disparado apareça em mensagens rapidamente.
          ETL_DISPARO_DAYS: 5
          # disparo há menos de N horas -> fetch caro direto (garante o template em
          # `mensagens` mesmo se o sync do envio falhar). Mais antigo que isso passa pela
          # checagem barata: só quem RESPONDEU custa fetch. Antes TODOS iam pro fetch
          # (medido 26/07: 544 fetches caros/run, ~27 min só nisso).
          ETL_DISPARO_FRESCO_H: 6
          RD_CONVERSAS_TOKEN: ${{ secrets.RD_CONVERSAS_TOKEN }}
          RD_CONVERSAS_BASE_URL: ${{ secrets.RD_CONVERSAS_BASE_URL }}
          RD_CONVERSAS_PRIVATE_JWK: ${{ secrets.RD_CONVERSAS_PRIVATE_JWK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run etl
